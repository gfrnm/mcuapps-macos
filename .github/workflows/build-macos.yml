name: Build, Sign and Notarize macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Import Apple Certificates into Keychain
        env:
          MACOS_APP_KEY: ${{ secrets.MACOS_APP_KEY }}
          MACOS_APP_PEM: ${{ secrets.MACOS_APP_PEM }}
          MACOS_INST_KEY: ${{ secrets.MACOS_INST_KEY }}
          MACOS_INST_PEM: ${{ secrets.MACOS_INST_PEM }}
          CERT_PASS: "MCUApps2026!"
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Write PEM files
          echo "$MACOS_APP_KEY" > $RUNNER_TEMP/app.key
          echo "$MACOS_APP_PEM" > $RUNNER_TEMP/app.pem
          echo "$MACOS_INST_KEY" > $RUNNER_TEMP/inst.key
          echo "$MACOS_INST_PEM" > $RUNNER_TEMP/inst.pem

          # Convert to PKCS12 using macOS native LibreSSL / OpenSSL
          openssl pkcs12 -export -inkey $RUNNER_TEMP/app.key -in $RUNNER_TEMP/app.pem -out $RUNNER_TEMP/app.p12 -passout pass:"$CERT_PASS"
          openssl pkcs12 -export -inkey $RUNNER_TEMP/inst.key -in $RUNNER_TEMP/inst.pem -out $RUNNER_TEMP/inst.p12 -passout pass:"$CERT_PASS"

          # Import into Keychain
          security import $RUNNER_TEMP/app.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -T /usr/bin/codesign
          security import $RUNNER_TEMP/inst.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -T /usr/bin/productsign -T /usr/bin/pkgbuild

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Certificates successfully imported:"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Build, Sign & Notarize MCUApps
        env:
          DEVELOPER_ID_APP: "Developer ID Application: Gufron Muhaimin (JBKNM459K6)"
          DEVELOPER_ID_INST: "Developer ID Installer: Gufron Muhaimin (JBKNM459K6)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd MCUApps-macOS
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCUApps-macOS-Installers
          path: |
            MCUApps-macOS/*.dmg
            MCUApps-macOS/*.pkg
          retention-days: 30
